name: Daily NSE EOD Data Update

on:
  schedule:
    # 12:00 PM IST = 06:30 UTC (Mon-Fri)
    - cron: '30 6 * * 1-5'
    # 2:30 PM IST = 09:00 UTC (Mon-Fri)
    - cron: '0 9 * * 1-5'
    # 5:00 PM IST = 11:30 UTC (Final EOD Closing, Mon-Fri)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-eod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run NIFTY 500 EOD data fetcher
        run: python scripts/fetch_eod.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/screener_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update NIFTY 500 EOD data"
          git push
