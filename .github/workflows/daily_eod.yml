name: Daily NSE EOD Data Update

on:
  schedule:
    # 12:00 PM IST = 06:30 UTC (Monday to Friday)
    - cron: '30 6 * * 1-5'
    # 2:30 PM IST = 09:00 UTC (Monday to Friday)
    - cron: '0 9 * * 1-5'
    # 5:00 PM IST = 11:30 UTC (Final EOD Closing, Monday to Friday)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # मैन्युअल टेस्ट करने के लिए बटन

permissions:
  contents: write

jobs:
  update-eod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Fetch NSE EOD & Calculate Indicators
        run: python scripts/fetch_eod.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "RS EOD Bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/screener_data.json
          git commit -m "chore: update NSE EOD data" || exit 0
          git push
